; новое ТУТААААА
[general]
static=yes
writeprotect=no

; Контекст для телефонов
[phones]
; Телефон 101
exten => 101,1,Verbose(2, Звонок на 101 от ${CALLERID(all)})
same => n,Dial(SIP/101,30)
same => n,Hangup()
; Телефон 102
exten => 102,1,Verbose(2, Звонок на 102 от ${CALLERID(all)})
same => n,Dial(SIP/102,30)
same => n,Hangup()
; Телефон 103
exten => 103,1,Verbose(2, Звонок на 103 от ${CALLERID(all)})
same => n,Dial(SIP/103,30)
same => n,Hangup()

; Контекст для очередей
[queues]
; Очередь support
exten => 200,1,Verbose(2, Входящий в очередь support)
same => n,Answer()
same => n,Queue(support,t,,,30)
same => n,Hangup()
; Очередь sales
exten => 201,1,Verbose(2, Входящий в очередь sales)
same => n,Answer()
same => n,Queue(sales,t,,,30)
same => n,Hangup()

; Тестовый контекст для проверки
[test]
; Набрать 1000 для теста
exten => 1000,1,Verbose(2, Тестовый звонок)
same => n,Answer()
same => n,Playback(beep)
same => n,Wait(1)
same => n,SayNumber(1000)
same => n,Hangup()

; Музыка на удержании
exten => 3000,1,Verbose(2, Музыка на удержании)
same => n,Answer()
same => n,MusicOnHold(default,60)
same => n,Hangup()
