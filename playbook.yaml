---
- name: Установка и настройка Asterisk + FreePBX на Debian
  hosts: voip_servers
  become: yes
  vars_files:
    - group_vars/all.yaml

  tasks:
    - name: Установка базовых пакетов
      apt:
        name:
          - wget
          - tar
          - curl
          - gnupg
          - ca-certificates
          - cron
          - build-essential
          - git
          - ufw
          - vim
        state: present
        update_cache: no

    #- name: Настройка локали
    #  locale_gen:
    #    name: ru_RU.UTF-8
    #    state: present

    - name: Установка часового пояса
      timezone:
        name: "{{ timezone }}"

    - name: Установка и запуск chrony
      apt:
        name: chrony
        state: present
      notify: restart chrony

    - name: Настройка firewall
      ufw:
        rule: "{{ item.rule }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        state: enabled
        policy: deny

      with_items:
        - { rule: allow, port: "22", proto: tcp }
        - { rule: allow, port: "80", proto: tcp }
        - { rule: allow, port: "443", proto: tcp }
        - { rule: allow, port: "{{ sip_port }}", proto: tcp }
        - { rule: allow, port: "{{ sip_port }}", proto: udp }
        - { rule: allow, port: "{{ sip_tls_port }}", proto: tcp }
        - { rule: allow, port: "{{ sip_tls_port }}", proto: udp }
        - { rule: allow, port: "{{ rtp_start }}:{{ rtp_end }}", proto: udp }
      when: ansible_facts['os_family'] == 'Debian'

    - name: Создание пользователя asterisk
      user:
        name: asterisk
        #password: 123
        shell: /bin/bash
        create_home: yes
        system: yes

    - name: Установка зависимостей для сборки Asterisk
      apt:
        name:
          - libedit-dev
          - libxml2-dev
          - libsqlite3-dev
          - libssl-dev
          - libcurl4-openssl-dev
          - libpq-dev
          - libncurses5-dev
          - libnewt-dev
          - libjansson-dev
          - libsrtp2-dev
          - libiksemel-dev
          - libvorbis-dev
          - libogg-dev
          - libasound2-dev
          - sox
          - mpg123
          - sqlite3
          - odbc-postgresql
          - unixodbc-dev
        state: present

    - name: Check asterisk download
      shell: |
        asterisk -V 2>/dev/null | head -1 | grep -o '[0-9]\+
        \.[0-9]\+\.[0-9]\+' || echo "not_installed"
      register: asterisk_installed
      changed_when: false

    - name: Скачивание Asterisk
      get_url:
        url: "https://downloads.asterisk.org/pub/telephony/asterisk/asterisk-{{ asterisk_version }}.tar.gz"
        dest: "/tmp/asterisk-{{ asterisk_version }}.tar.gz"
        mode: "0644"
      register: download_asterisk
      when: asterisk_installed == 'not_installed'

    - name: Распаковка Asterisk
      unarchive:
        src: "/tmp/asterisk-{{ asterisk_version }}.tar.gz"
        dest: /usr/src/
        remote_src: yes
        creates: "/usr/src/asterisk-{{ asterisk_version }}"
      when: asterisk_installed == 'not_installed'

    - name: Check of asterisk packets
      shell: |
        dpkg -l | grep -E 'libedit|libxml2|libsqlite3|libssl-dev|libjansson|libncurses'
      register: deps_installed

    - name: Установка зависимостей Asterisk
      shell: |
        cd "/usr/src/asterisk-20.17.0/contrib/scripts"
        ./install_prereq install || true
      args:
        executable: /bin/bash
      #ignore_errors: yes
      changed_when: false
      when: deps_installed.stdout|int < 3

    - name: Check conf asterisk
      stat:
        path: /usr/src/asterisk-20.17.0
      register: asterisk_conf

    - name: Конфигурация Asterisk
      shell: |
        cd /usr/src/asterisk-20.17.0
        ./configure --with-jansson-bundled
      args:
        chdir: /usr/src/asterisk-20.17.0

    - name: Компиляция Asterisk
      shell: |
        cd /usr/src/asterisk-20.17.0
        make -j$(nproc)
      args:
        chdir: /usr/src/asterisk-20.17.0

    - name: Установка Asterisk
      shell: |
        cd /usr/src/asterisk-20.17.0
        make install
        make config
        ldconfig
        make samples
      args:
        chdir: /usr/src/asterisk-20.17.0

    - name: Настройка пользователя Asterisk
      lineinfile:
        path: /etc/asterisk/asterisk.conf
        regexp: "^#?{{ item.key }}"
        line: "{{ item.key }} = {{ item.value }}"
      with_items:
        - { key: "runuser", value: "asterisk" }
        - { key: "rungroup", value: "asterisk" }
        - { key: "defaultlanguage", value: "ru" }
        - { key: "documentation_language", value: "ru_RU" }

    - name: Настройка прав на каталоги
      file:
        path: "{{ item }}"
        state: directory
        owner: asterisk
        group: asterisk
        mode: '0755'
        recurse: yes
      with_items:
        - /var/run/asterisk
        - /etc/asterisk
        - /var/lib/asterisk
        - /var/log/asterisk
        - /var/spool/asterisk
        - /var/spool/asterisk/monirot
        - /var/spool/asterisk/voicemail

    - name: Installing rus sound
      apt:
        name: asterisk_core_sounds-ru-wav
        state: present

    - name: Download await music
      get_url:
        url: "https://files.asterisk.org/pub/telephony/sounds/asterisk-moh-opsound-wav.tar.gz"
        dest: /tmp/asterisk-moh.tar.gz
      when: install_music_on_hold | default(true)

    - name: Unpack music
      unarchive:
        src: /tmp/asterisk-moh.tar.gz
        dest: /var/lib/asterisk/moh/
        remote_src: yes
        creates: /var/lib/asterisk/moh/opsound
      when: install_music_on_hold | default(true)

    - name: Copy pjsip.conf (SIP phones)
      template:
        src: "/templates/pjsip.conf.j2"
        dest: /etc/asterisk/pjsip.conf
        owner: asterisk
        group: asterisk
        mode: '0640'

    - name: Copy extensions.conf (calls)
      template:
        src: "/templates/extensions.conf.j2"
        dest: /etc/asterisk/extensions.conf
        owner: asterisk
        group: asterisk
        mode: '0640'

    - name: Copy queues.conf
      template:
        src: "/templates/queues.conf"
        dest: /etc/asterisk/queues.conf
        owner: asterisk
        group: asterisk
        mode: '0640'

    - name: Copy voicemail.conf
      template:
        src: "/templates/voicemail.conf.j2"
        dest: /etc/asterisk/voicemail.conf
        owner: asterisk
        group: asterisk
        mode: '0640'

    - name: adding musichold.conf
      copy:
        dest: /etc/asterisk/musichold.conf
        content: |
          [default]
          mode = files
          directory = /var/lib/asterisk/moh/opsound
          random = yes
        owner: asterisk
        group: asterisk
        mode: '0640'

    - name: Adding cdr.conf (recording)
      copy:
        dest: /etc/asterisk/cdr.conf
        content: |
          [general]
          enable = yes

          [sqlite]
          usegmtime = yes
        owner: asterisk
        group: asterisk
        mode: '0640'

    - name: Adding systemd Service
      copy:
        dest: /etc/systemd/system/asterisk.service
        content: |
          [Unit]
          Description=Asterisk PBX
          After=network.target

          [Service]
          Type=forking
          User=asterisk
          Group=asterisk
          ExecStart=/usr/sbin/asterisk -f
          ExecReload=/usr/sbin/asterisk -rx 'core reload'
          ExecStop=/usr/sbin/asterisk -rx 'core stop now'
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reloading systemd
      systemd:
        daemon_reload: yes



    - name: Настройка автоматического запуска
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
      with_items:
        - asterisk

    #- name: reload asterisk
    #  shell: |
    #    asterisk -rx "core reload"
